services:
  # ===========================================================================
  # 1. SERVICE BASIS DATA (MySQL 8.0)
  # ===========================================================================
  database:
    image: mysql:8.0
    container_name: kost_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-uts-kepl}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kost_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root || mysqladmin ping -h localhost -u root -p$${DB_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # 2. SERVICE BACKEND (Laravel 12 + FrankenPHP)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kost_backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:/AuiaD2XB2ZYRRSGyLyNnB/14NijrCVc7EB/D3Oqems=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      LOG_CHANNEL: ${LOG_CHANNEL:-stdout}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-uts-kepl}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SERVER_NAME: ":8000"
    ports:
      - "${FORWARD_BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kost_network

  # ===========================================================================
  # 3. SERVICE FRONTEND (Vue 3 + Vite + Nginx Reverse Proxy)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: kost_frontend
    restart: unless-stopped
    ports:
      - "${FORWARD_FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kost_network

  # ===========================================================================
  # 4. MONITORING: PROMETHEUS (Versi Terkunci: v2.54.1)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: kost_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - kost_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # 5. MONITORING: GRAFANA (Versi Terkunci: 11.1.0)
  # ===========================================================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: kost_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - kost_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # 6. MONITORING: NODE EXPORTER (Versi Terkunci: v1.8.2)
  # ===========================================================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: kost_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - kost_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # 7. MONITORING: CADVISOR (Versi Terkunci: v0.49.1)
  # ===========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: kost_cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - kost_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# NAMED VOLUMES
volumes:
  mysql_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# NETWORKS
networks:
  kost_network:
    driver: bridge
